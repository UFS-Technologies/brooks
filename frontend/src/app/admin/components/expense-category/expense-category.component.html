@if(isLoading){
<app-loading [isLoading]="isLoading"></app-loading>
}

<div class="container mx-auto p-4">
  <h2 class="text-2xl font-bold mb-4">Expense Category</h2>
  <div class="mb-4 p-4 bg-gray-100 rounded-lg shadow" style="display: flex;justify-content: space-between;">
    <!-- <h2 class="text-lg font-semibold mb-2">Add Expense List</h2> -->
    @if (save_status) {
    <form #validButton="ngForm" (ngSubmit)="Save_Expense_Category(validButton)" novalidate>
  <div class="grid grid-cols-1 md:grid-cols-4 gap-4 items-start">

    <!-- Input with floating error -->
    <div class="relative mb-4">
      <input
        [(ngModel)]="saveExpenseCategory"
        required
        #expenseInput="ngModel"
        name="expenseCategory"
        type="text"
        placeholder="Enter expense category here"
        class="border border-gray-300 p-2 rounded w-full"
      />

      <!-- Reserve space below input, show error absolutely -->
      <div class="h-5">
        <small
          class="text-red-600 text-sm absolute left-0 mt-1"
          *ngIf="expenseInput.invalid && expenseInput.touched">Fill the expense category
        </small>
      </div>
    </div>

    <!-- Submit Button -->
    <button
      [disabled]="expenseInput.invalid"
      type="submit"
      class="bg-green-700 text-white rounded-lg hover:bg-green-900 transition-colors h-10 disabled:opacity-50 disabled:cursor-not-allowed"
      style="background-color: blue !important; color: white !important; width: 80px;"
    >
      {{ selectedExpenseID ? 'Update' : 'Save' }}
    </button>

  </div>
</form>
    }@else {
    <div class=" relative grid grid-cols-1 md:grid-cols-4 gap-4">
      <!-- Serach Expense type -->
      <div class="relative">
        <input type="text" 
         [(ngModel)]="searchQuery" (input)="searchExpenseCategory()"
         placeholder="Search expense category type..."
         class="w-auto pl-10 pr-4 py-2 border-2 border-gray-300 focus:border-blue-500 focus:ring focus:ring-blue-200 focus:ring-opacity-50 transition duration-300"/>
         <svg class="absolute left-3 top-1/2 transform -translate-y-1/2 h-5 w-5 text-gray-400 "
          xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd"
            d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z"
            clip-rule="evenodd" />
        </svg>
      </div>
         <!-- <button class="bg-lightBlue-700 text-white px-4 py-2 rounded-lg hover:bg-blue-800 transition-colors"
          (click)="searchExpense()" style="background-color: blue !important; color: white !important;"> Search </button> -->
      <!-- Add Expense Type -->
      <button *ngIf="isSave" class="bg-green-700 text-white px-4 py-2 rounded-lg hover:bg-green-900 transition-colors"
        (click)="addExpenseCategory()" style="background-color: blue !important; color: white !important;">
        + Add Expense category
      </button>
    </div>

    }

    @if (save_status || selectedExpenseID) {
    <button type="button" (click)="cancelEdit()"
      class="bg-gray-600 text-white rounded-lg ml-2 hover:bg-gray-950 transition-colors h-10" style="width: 100px;">
      Back
    </button>
    }


  </div>
  <div class="overflow-y-auto max-h-96">
  <table class="min-w-full">
    <thead class="bg-gray-100 sticky top-0 z-10">
      <tr>
        <th class="py-3 px-6 text-center w-1/6">NO.</th>
        <th class="py-3 px-6 text-center w-3/6">Expense Category</th>
        <th *ngIf="isEdit || isDelete"  class="py-3 px-6 text-center w-2/6">Actions</th>
      </tr>
    </thead>
      <tbody class="text-gray-600 text-sm font-light">
        <tr *ngFor="let list of filteredExpCategory; let i = index"  class="border-b border-gray-200 hover:bg-gray-100">
          <td class="py-3 px-6 text-center">{{ i + 1 }}</td>
          <td class="py-3 px-6 text-center break-words">{{ list.Expense_Category_Name }}</td>
          <td *ngIf="isEdit || isDelete" class="py-3 px-6 text-center action-icons">
            <div class="flex gap-2 justify-center">
              <button *ngIf="isEdit" (click)="editExpenseCategory(list)"
                class="flex items-center h-10 px-4 py-2 bg-yellow-50 text-yellow-700 rounded-md hover:bg-yellow-100 transition-all duration-300 transform hover:scale-105 whitespace-nowrap">
                <span class="material-symbols-outlined mr-2">edit</span>
              </button>
              <button *ngIf="isDelete" (click)="deleteExpenseCategory(list)"
                class="flex items-center h-10 px-4 py-2 bg-red-50 text-red-700 rounded-md hover:bg-red-100 transition-all duration-300 transform hover:scale-105 whitespace-nowrap">
                <span class="material-symbols-outlined mr-2">delete</span>
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
    <div *ngIf="noResults" class="text-center text-red-500 mt-4">
    No matching expense category found.
     </div>
  </div>
</div>
