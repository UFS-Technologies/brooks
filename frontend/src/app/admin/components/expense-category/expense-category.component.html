@if(isLoading){
<app-loading [isLoading]="isLoading"></app-loading>
}

<div class="container mx-auto p-0">
  <div class="mt-5 mb-3 p-3 bg-white rounded-lg shadow-sm border border-gray-100" style="display: flex;justify-content: space-between; align-items: center;">
    <!-- <h2 class="text-lg font-semibold mb-2">Add Expense List</h2> -->
    @if (save_status) {
    <form #validButton="ngForm" (ngSubmit)="Save_Expense_Category(validButton)" novalidate class="w-full">
      <div class="flex flex-wrap items-center gap-4">
        <!-- Input with floating error -->
        <div class="relative flex-grow max-w-md">
          <input
            [(ngModel)]="saveExpenseCategory"
            required
            #expenseInput="ngModel"
            name="expenseCategory"
            type="text"
            placeholder="Enter expense category here"
            class="w-full px-4 py-2 border-2 border-gray-300 rounded-md focus:border-sky-500 focus:ring focus:ring-sky-200 focus:ring-opacity-50 transition duration-300"
          />
          <!-- Error message -->
          <small
            class="text-red-600 text-xs absolute left-0 -bottom-5"
            *ngIf="expenseInput.invalid && expenseInput.touched">Fill the expense category
          </small>
        </div>

        <!-- Submit Button -->
        <button
          [disabled]="expenseInput.invalid"
          type="submit"
          class="bg-sky-500 hover:bg-sky-600 text-white font-semibold h-[39px] px-6 rounded-md transition duration-300 ease-in-out focus:outline-none focus:ring-2 focus:ring-sky-500 focus:ring-opacity-50 flex justify-center items-center"
          style="background-color: blue !important; color: white !important;"
        >
          {{ selectedExpenseID ? 'Update' : 'Save' }}
        </button>
      </div>
    </form>
    }@else {
    <div class="flex flex-wrap items-center gap-4 w-full">
      <!-- Serach Expense type -->
      <div class="relative flex-grow max-w-md">
        <input type="text" 
         [(ngModel)]="searchQuery" (input)="searchExpenseCategory()"
         placeholder="Search expense category type..."
         class="w-full pl-10 pr-4 py-1.5 border-2 border-gray-300 rounded-md focus:border-sky-500 focus:ring focus:ring-sky-200 focus:ring-opacity-50 transition duration-300"/>
         <svg class="absolute left-3 top-1/2 transform -translate-y-1/2 h-5 w-5 text-gray-400 "
          xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd"
            d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z"
            clip-rule="evenodd" />
        </svg>
      </div>
      <!-- Add Expense Type -->
      <button *ngIf="isSave" class="bg-sky-500 hover:bg-sky-600 text-white font-semibold h-[39px] px-6 rounded-md transition duration-300 ease-in-out focus:outline-none focus:ring-2 focus:ring-sky-500 focus:ring-opacity-50 flex justify-center items-center space-x-2 ml-auto"
        (click)="addExpenseCategory()" style="background-color: blue !important; color: white !important;">
        <span class="material-symbols-outlined">add</span>
        <span>Add Expense category</span>
      </button>
    </div>
    }

    @if (save_status || selectedExpenseID) {
    <button type="button" (click)="cancelEdit()"
      class="border border-gray-300 hover:bg-gray-100 text-gray-700 font-semibold h-[39px] px-6 rounded-md transition duration-300 ml-2">
      Back
    </button>
    }
  </div>

  <div class="mt-3 overflow-x-auto w-full overflow-y-auto max-h-[500px] border border-gray-200 rounded-lg bg-white shadow-sm">
    <table class="min-w-full w-full text-sm text-gray-800 table-auto border-collapse">
      <thead class="bg-gray-100 text-left sticky top-0 z-10">
        <tr>
          <th class="px-6 py-2 whitespace-nowrap font-semibold">NO.</th>
          <th class="px-6 py-2 whitespace-nowrap font-semibold">Expense Category</th>
          <th *ngIf="isEdit || isDelete"  class="px-6 py-2 whitespace-nowrap font-semibold text-center">Actions</th>
        </tr>
      </thead>
      <tbody class="bg-white">
        <tr *ngFor="let list of filteredExpCategory; let i = index"  class="border-b hover:bg-gray-50 transition duration-200">
          <td class="px-6 py-2 whitespace-nowrap">{{ i + 1 }}</td>
          <td class="px-6 py-2 break-words">{{ list.Expense_Category_Name }}</td>
          <td *ngIf="isEdit || isDelete" class="px-6 py-2 whitespace-nowrap">
            <div class="flex gap-3 justify-center">
              <button *ngIf="isEdit" (click)="editExpenseCategory(list)"
                class="flex items-center p-1.5 bg-yellow-50 text-yellow-600 rounded-md hover:bg-yellow-100 transition-colors" title="Edit">
                <span class="material-symbols-outlined text-xl">edit</span>
              </button>
              <button *ngIf="isDelete" (click)="deleteExpenseCategory(list)"
                class="flex items-center p-1.5 bg-red-50 text-red-600 rounded-md hover:bg-red-100 transition-colors" title="Delete">
                <span class="material-symbols-outlined text-xl">delete</span>
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
    <div *ngIf="noResults" class="p-8 text-center text-gray-500 bg-white">
      <span class="material-symbols-outlined text-4xl block mb-2">search_off</span>
      No matching expense category found.
     </div>
  </div>
</div>
