@if(isLoading){
<app-loading [isLoading]="isLoading"></app-loading>
}

<div class="container mx-auto p-2">
  <!-- <h2 class="text-2xl font-bold mb-4">Enquiry Source</h2> -->
  <!-- <div class="mb-3 mt-3 p-3 bg-white-100 rounded-lg shadow" style="display: flex;justify-content: space-between;"> -->
    <div class="mb-3 mt-3 p-3 bg-white rounded-lg shadow" style="display: flex; justify-content: space-between;">
    @if (save_status) {
    <form #validButton="ngForm" (ngSubmit)="Save_Enquiry_Source(validButton)" novalidate>
      <div class="grid grid-cols-1 md:grid-cols-4 gap-4 items-start">

        <div class="relative mb-4">
          <input
            [(ngModel)]="saveEnquirySource"
            required
            #enquiryInput="ngModel"
            name="enquirySource"
            type="text"
            placeholder="Enter enquiry source"
            class="border border-gray-300 p-2 rounded w-full h-8"
          />

          <div class="h-5">
            <small
              class="text-red-600 text-sm absolute left-0 mt-1"
              *ngIf="enquiryInput.invalid && enquiryInput.touched">Fill the enquiry source
            </small>
          </div>
        </div>

        <button
          [disabled]="enquiryInput.invalid"
          type="submit"
          class="bg-sky-500 text-white rounded-lg hover:bg-sky-600 transition-colors h-8 disabled:opacity-50 disabled:cursor-not-allowed"
          style="background-color: blue !important; color: white !important; width: 70px;"
        >
          {{ selectedEnquiryID ? 'Update' : 'Save' }}
        </button>

      </div>
    </form>
    }@else {
    <div class=" relative grid grid-cols-1 md:grid-cols-4 gap-4">
      <div class="relative">
        <input type="text" 
         [(ngModel)]="searchQuery" (input)="searchEnquirySource()"
         placeholder="Search enquiry source..."
         class="w-auto pl-10 pr-4 py-1 border-2 border-gray-300 focus:border-blue-500 focus:ring focus:ring-blue-200 focus:ring-opacity-50 transition duration-300 h-8"/>
         <svg class="absolute left-3 top-1/2 transform -translate-y-1/2 h-5 w-5 text-gray-400 "
          xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd"
            d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z"
            clip-rule="evenodd" />
        </svg>
      </div>
      <button *ngIf="isSave" class="bg-sky-500 text-white px-4 py-1 rounded-lg hover:bg-sky-600 font-semibold transition-colors whitespace-nowrap h-8 text-sm"
        (click)="addEnquirySource()" style="background-color: blue !important; color: white !important;">
        + Add Enquiry Source
      </button>
    </div>

    }

    @if (save_status || selectedEnquiryID) {
    <button type="button" (click)="cancelEdit()"
      class="bg-gray-600 text-white rounded-lg ml-2 hover:bg-gray-950 transition-colors h-8 text-sm" style="width: 80px;">
      Back
    </button>
    }

  </div>
  <!-- <div class="border border-gray-200 mt-2 p-1"> -->
    <div class="border border-gray-200 rounded-xl mt-2 p-1">
  <table class="min-w-full">
    <!-- <thead class="bg-gray-100 sticky top-0 z-10">
      <tr>
        <th class="py-3 px-6 text-left w-2/6">Enquiry Source</th>
        <th *ngIf="isEdit || isDelete"  class="py-3 px-6 text-center w-2/6">Actions</th>
      </tr>
    </thead> -->
      <tbody class="text-gray-600 text-sm font-medium">
        <tr *ngFor="let list of filteredEnquirySource; let i = index"  class="border-b border-gray-200 hover:bg-gray-50 bg-white shadow-sm mt-0.5 mb-0.5 block m-1 h-[40px] items-center" style="display: flex;">
          <td class="py-2 px-6 text-left break-words w-2/3">{{ list.Enquiry_Source_Name }}</td>
          <td *ngIf="isEdit || isDelete" class="py-2 px-6 action-icons w-1/3 flex justify-end">
            <div class="flex gap-4">
              <button *ngIf="isEdit" (click)="editEnquirySource(list)"
                class="flex items-center justify-center text-yellow-700 hover:text-yellow-800 transition-colors">
                <span class="material-symbols-outlined" style="font-size: 18px;">edit</span>
              </button>
              <button *ngIf="isDelete" (click)="deleteEnquirySource(list)"
                class="flex items-center justify-center text-red-700 hover:text-red-800 transition-colors">
                <span class="material-symbols-outlined" style="font-size: 18px;">delete</span> 
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
    <div *ngIf="noResults" class="text-center text-red-500 mt-4">
    No matching enquiry source found.
     </div>
  </div>
</div>
