<div class="container">
  <h1>Team Assignment</h1>
  <p class="team-name">Team Lead: {{ teamLeadName || ('User #' + teamLeadId) }}</p>

  <table>
    <thead>
      <tr>
        <th style="width: 85%">Staff Name</th>
        <th style="width: 15%">Select</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let staff of staffList">
        <td>{{ staff.Full_Name }}</td>
        <td><input type="checkbox" [(ngModel)]="staff.IsSelected" /></td>
      </tr>
      <tr *ngIf="!isLoading && staffList.length === 0">
        <td colspan="2" class="empty-row">No staff found</td>
      </tr>
    </tbody>
  </table>

  <div class="action-buttons">
    <button type="button" (click)="Cancel()" class="cancel-btn">Cancel</button>
    <button type="button" (click)="SaveTeamAssignment()" class="save-btn">Save</button>
  </div>
</div>
