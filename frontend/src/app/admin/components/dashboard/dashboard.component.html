    <!-- Card 1: Popular Course -->
    <div class="bg-white rounded-2xl shadow-md border border-slate-100 p-8 transition-all hover:shadow-lg">
      <div class="flex items-center gap-3 mb-8">
        <div class="w-2 h-8 bg-indigo-600 rounded-full shadow-sm shadow-indigo-200"></div>
        <h2 class="text-2xl font-bold text-slate-800 tracking-tight">Popular Course</h2>
      </div>
      <div class="h-[450px]">
        <canvas baseChart
          [data]="barChartData"
          [options]="barChartOptions"
          [type]="barChartType"
          [legend]="barChartLegend">
        </canvas>
      </div>
    </div>

    <!-- Card 2: Month Wise Student Enrollment -->
    <div class="bg-white rounded-2xl shadow-md border border-slate-100 p-8 transition-all hover:shadow-lg">
      <div class="flex items-center gap-3 mb-8">
        <div class="w-2 h-8 bg-amber-500 rounded-full shadow-sm shadow-amber-200"></div>
        <h2 class="text-2xl font-bold text-slate-800 tracking-tight">Month Wise Student Enrollment</h2>
      </div>
      <div class="h-[450px]">
        <canvas baseChart
          [data]="barChartData2"
          [options]="barChartOptions"
          [type]="barChartType"
          [legend]="barChartLegend">
        </canvas>
      </div>
    </div>

    <!-- Card 3: Month Wise Lead Report -->
    <div class="bg-white rounded-2xl shadow-md border border-slate-100 p-8 transition-all hover:shadow-lg">
      <div class="flex items-center gap-3 mb-8">
        <div class="w-2 h-8 bg-indigo-500 rounded-full shadow-sm shadow-indigo-100"></div>
        <h2 class="text-2xl font-bold text-slate-800 tracking-tight">Month Wise Lead Report</h2>
      </div>
      <div class="h-[450px]">
        <canvas baseChart
          [data]="barChartData4"
          [options]="barChartOptions"
          [type]="barChartType"
          [legend]="barChartLegend">
        </canvas>
      </div>
    </div>

    <!-- Card 4: Course Wise Monthly Enrollment -->
    <div class="bg-white rounded-2xl shadow-md border border-slate-100 p-8 transition-all hover:shadow-lg">
      <div class="flex items-center gap-3 mb-8">
        <div class="w-2 h-8 bg-emerald-500 rounded-full shadow-sm shadow-emerald-200"></div>
        <h2 class="text-2xl font-bold text-slate-800 tracking-tight">Course Wise Monthly Enrollment</h2>
      </div>
      <div class="h-[450px]">
        <canvas baseChart
          [data]="barChartData3"
          [options]="barChartOptions"
          [type]="'line'"
          [legend]="barChartLegend">
        </canvas>
      </div>
    </div>

    <!-- Card 5: Student Status Representation -->
    <div class="bg-white rounded-2xl shadow-md border border-slate-100 p-8 transition-all hover:shadow-lg">
      <div class="flex items-center gap-3 mb-8">
        <div class="w-2 h-8 bg-teal-500 rounded-full shadow-sm shadow-teal-200"></div>
        <h2 class="text-2xl font-bold text-slate-800 tracking-tight">Student Status Representation</h2>
      </div>
      <div class="h-[450px] w-full lg:w-1/2 mx-auto flex justify-center pb-5">
        <canvas baseChart
          [data]="pieChartData3"
          [options]="pieChartOptions"
          [type]="pieChartType"
          [legend]="pieChartLegend">
        </canvas>
      </div>
    </div>
  </div>
</div>
