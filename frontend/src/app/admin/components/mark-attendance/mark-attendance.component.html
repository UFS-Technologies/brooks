<div class="attendance-page">
  <!-- Header -->
  <div class="attendance-header">
    <div class="header-left">
      <button mat-icon-button (click)="goBack()" class="back-btn" title="Back to My Students">
        <mat-icon>arrow_back</mat-icon>
      </button>
      <div class="header-title">
        <!-- <mat-icon class="title-icon">how_to_reg</mat-icon> -->
        <h2>Attendance Marking Page</h2>
      </div>
    </div>
  </div>

  <!-- Filters Section -->
  <section class="container-section">
    <div class="filter-row">
      <!-- Course Dropdown -->
      <div class="flex-1">
        <div class="relative">
          <select [formControl]="selectedCourse" (change)="onCourseChange()" class="w-full">
            <option value=""> Select Course</option>
            <option *ngFor="let course of courseList" [value]="course.Course_Name">
              {{ course.Course_Name }}
            </option>
          </select>
        </div>
      </div>

      <!-- Batch Dropdown -->
      <div class="flex-1">
        <div class="relative">
          <select [formControl]="selectedBatch" (change)="onBatchChange()" class="w-full">
            <option value="">Select Batch </option>
            <option *ngFor="let batch of batchList" [value]="batch.Batch_Name">
              {{ batch.Batch_Name }}
            </option>
          </select>
        </div>
      </div>

      <!-- Date Picker -->
      <div class="flex-1">
        <div class="relative">
          <input type="date" [formControl]="attendanceDate" class="w-full">
        </div>
      </div>

    </div>
  </section>

  <!-- Student Attendance Table -->
  <div class="table-card">
    <!-- Loading State -->
    <div *ngIf="isLoadingStudents" class="loading-state">
      <mat-icon class="spin-icon">refresh</mat-icon>
      <p>Loading students...</p>
    </div>

    <!-- Empty State -->
    <div *ngIf="!isLoadingStudents && studentList.length === 0" class="empty-state">
      <mat-icon class="empty-icon">group_off</mat-icon>
      <p>Select a Course and Batch to view students</p>
    </div>

    <!-- Table -->
    <div *ngIf="!isLoadingStudents && studentList.length > 0" class="table-wrapper">
      <table class="attendance-table">
        <thead>
          <tr>
            <th class="col-num">Sl No</th>
            <th class="col-name">Student Name</th>
            <th class="col-status">Status</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let student of studentList; let i = index"
              [class.status-present]="attendanceStatuses.get(student.Student_ID) === 1"
              [class.status-absent]="attendanceStatuses.get(student.Student_ID) === 0"
              [class.status-leave]="attendanceStatuses.get(student.Student_ID) === 2"
              [class.status-late]="attendanceStatuses.get(student.Student_ID) === 3">
            <td class="col-num">{{ i + 1 }}</td>
            <td class="col-name">
              <div class="student-info">

                <span class="student-name">{{ student.First_Name ? (student.First_Name + ' ' + (student.Last_Name || '')) : student.Name }}</span>
              </div>
            </td>
            <td class="col-status">
              <div class="status-radio-group">
                <label class="radio-option present"
                       [class.active]="attendanceStatuses.get(student.Student_ID) === 1">
                  <input type="radio" [name]="'status_' + student.Student_ID" [value]="1"
                         [checked]="attendanceStatuses.get(student.Student_ID) === 1"
                         (change)="setAttendanceStatus(student.Student_ID, 1)">
                  <span class="radio-label">Present</span>
                </label>

                <label class="radio-option absent"
                       [class.active]="attendanceStatuses.get(student.Student_ID) === 0">
                  <input type="radio" [name]="'status_' + student.Student_ID" [value]="0"
                         [checked]="attendanceStatuses.get(student.Student_ID) === 0"
                         (change)="setAttendanceStatus(student.Student_ID, 0)">
                  <span class="radio-label">Absent</span>
                </label>

                <label class="radio-option late"
                       [class.active]="attendanceStatuses.get(student.Student_ID) === 3">
                  <input type="radio" [name]="'status_' + student.Student_ID" [value]="3"
                         [checked]="attendanceStatuses.get(student.Student_ID) === 3"
                         (change)="setAttendanceStatus(student.Student_ID, 3)">
                  <span class="radio-label">Late</span>
                </label>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Action Buttons -->
    <div *ngIf="studentList.length > 0" class="action-bar">

      <button class="btn btn-save" (click)="saveAttendance()" [disabled]="isSavingAttendance">
        <mat-icon *ngIf="isSavingAttendance" class="spin-icon">refresh</mat-icon>
        {{ isSavingAttendance ? 'Saving...' : 'Save' }}
      </button>
      <button class="btn btn-cancel" (click)="goBack()">
        Cancel
      </button>
    </div>
  </div>
</div>
