<div class="p-6">
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-semibold text-gray-800">Mock Test Packages</h1>
    <button *ngIf="!showForm" (click)="openCreateForm()" 
            class="bg-[#0d6efd] hover:bg-[#0b5ed7] text-white font-medium py-2 px-4 rounded-md shadow-sm transition-colors flex items-center">
      <span class="material-symbols-outlined mr-2 text-sm">add</span> Add Package
    </button>
  </div>

  <!-- Form Area -->
  <div *ngIf="showForm" class="bg-white rounded-lg shadow p-6 mb-6">
    <h2 class="text-lg font-medium text-gray-800 mb-4">{{ isEditing ? 'Edit' : 'Add' }} Package</h2>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Package Name <span class="text-red-500">*</span></label>
        <input type="text" [(ngModel)]="currentPackage.Package_Name" 
               class="w-full rounded-md border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue"
               placeholder="e.g. IELTS Mock Test Package">
      </div>
    </div>
    
    <div class="mt-6 flex justify-end gap-3">
      <button (click)="closeForm()" 
              class="px-4 py-2 border border-gray-300 text-gray-700 rounded-md hover:bg-gray-50 transition-colors">
        Cancel
      </button>
      <button (click)="savePackage()" [disabled]="isSaving"
              class="px-4 py-2 bg-green-600 text-white rounded-md hover:bg-green-700 transition-colors disabled:opacity-50 flex items-center">
        <span *ngIf="isSaving" class="inline-block animate-spin rounded-full h-4 w-4 border-b-2 border-white mr-2"></span>
        Save
      </button>
    </div>
  </div>

  <!-- Search & List -->
  <div *ngIf="!showForm">
    <div class="bg-white rounded-lg shadow p-6 mb-6">
      <input type="text" [(ngModel)]="searchTerm" (input)="onSearch()" 
             placeholder="Search packages by name..." 
             class="w-full md:w-1/2 rounded-md border border-gray-300 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue">
    </div>

    <div *ngIf="isLoading" class="text-center py-10">
      <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-blue"></div>
      <p class="mt-2 text-gray-600">Loading packages...</p>
    </div>

    <div *ngIf="!isLoading" class="bg-white rounded-lg shadow overflow-hidden">
      <table class="min-w-full divide-y divide-gray-200">
        <thead class="bg-gray-50">
          <tr>
            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Package Name</th>
            <th scope="col" class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
          </tr>
        </thead>
        <tbody class="bg-white divide-y divide-gray-200">
          <tr *ngFor="let pkg of filteredPackages" class="hover:bg-gray-50 transition-colors">
            <td class="px-6 py-4 whitespace-nowrap">
              <div class="text-sm font-medium text-gray-900">{{ pkg.Package_Name }}</div>
            </td>
            <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
              <button (click)="editPackage(pkg)" class="text-blue hover:text-blue-hover mr-4" title="Edit">
                <span class="material-symbols-outlined text-sm">edit</span>
              </button>
              <button (click)="deletePackage(pkg)" class="text-red-600 hover:text-red-900" title="Delete">
                <span class="material-symbols-outlined text-sm">delete</span>
              </button>
            </td>
          </tr>
          <tr *ngIf="filteredPackages.length === 0">
            <td colspan="2" class="px-6 py-10 text-center text-sm text-gray-500">
              No packages found.
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
