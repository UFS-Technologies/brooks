@if(isLoading){
<app-loading [isLoading]="isLoading"></app-loading>
}

<div class="container mx-auto p-4">
  <h2 class="text-2xl font-bold mb-4">Expense Types</h2>
  <div class="mb-4 p-4 bg-gray-100 rounded-lg shadow" style="display: flex;justify-content: space-between;">
    <!-- <h2 class="text-lg font-semibold mb-2">Add Expense List</h2> -->
    @if (save_status) {
    <form #validButton="ngForm" (ngSubmit)="Save_Expense_Type(validButton)" novalidate>
  <div class="grid grid-cols-1 md:grid-cols-4 gap-4 items-start">

    <!-- Input with floating error -->
 

      <div class="relative mb-4 flex-1">
  <label for="expenseCategory" class="block text-sm font-medium text-gray-700">Select Expense Category</label>
  <select
    id="expenseCategory"
    name="expenseCategory"
    [(ngModel)]="selectedCategoryID"
    required
    class="mt-1 block w-full py-2 px-3 border border-gray-300 bg-white rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
  >
    <option *ngFor="let category of getExpCategory" [value]="category.Expense_Category_Id">
      {{ category.Expense_Category_Name }}
    </option>
  </select>
</div>

<div class="mb-4 flex-1">
  <label for="expenseType" class="block text-sm font-medium text-gray-700">Expense Type</label>
  <input
   #expenseInput="ngModel"
    type="text"
    id="expenseType"
    name="expenseType"
    [(ngModel)]="saveExpType"
    required
    class="mt-1 block w-full py-2 px-3 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
  />
    </div>
<div class="mb-4 flex-1">
    <button
      [disabled]="expenseInput.invalid"
      type="submit"
      class="bg-green-700 text-white rounded-lg hover:bg-green-900 transition-colors h-10 disabled:opacity-50 disabled:cursor-not-allowed mt-5"
      style="background-color: blue !important; color: white !important; width: 80px;"
    >
      {{ selectedExpenseID ? 'Update' : 'Save' }}
    </button>
  </div>

</div>
 
      

  
</form>
    }@else {
    <div class=" relative grid grid-cols-1 md:grid-cols-4 gap-4">
      <!-- Serach Expense type -->
      <div class="relative">
        <input type="text" 
         [(ngModel)]="searchQuery" (input)="searchExpense()"
         placeholder="Search expense type..."
         class="w-full pl-10 pr-4 py-2 border-2 border-gray-300 focus:border-blue-500 focus:ring focus:ring-blue-200 focus:ring-opacity-50 transition duration-300"/>
         <svg class="absolute left-3 top-1/2 transform -translate-y-1/2 h-5 w-5 text-gray-400 "
          xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd"
            d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z"
            clip-rule="evenodd" />
        </svg>
      </div>
         <!-- <button class="bg-lightBlue-700 text-white px-4 py-2 rounded-lg hover:bg-blue-800 transition-colors"
          (click)="searchExpense()" style="background-color: blue !important; color: white !important;"> Search </button> -->
      <!-- Add Expense Type -->
      <button *ngIf="isSave" class="bg-green-700 text-white px-4 py-2 rounded-lg hover:bg-green-900 transition-colors"
        (click)="addexpense()" style="background-color: blue !important; color: white !important;">
        + Add Expense type
      </button>
    </div>

    }

    @if (save_status || selectedExpenseID) {
    <button type="button" (click)="cancelEdit()"
      class="bg-gray-500 text-white rounded-lg ml-2 hover:bg-gray-700 transition-colors h-10" style="width: 100px;">
      Back
    </button>
    }


  </div>
  <div class="overflow-y-auto max-h-80">
  <table class="min-w-full ">
    <thead class="bg-gray-100 sticky top-0 z-10">
      <tr>
        <th class="py-3 px-6 text-center w-1/12">NO.</th>
        <th class="py-3 px-6 text-center w-2/6">Expense Category</th>
        <th class="py-3 px-6 text-center w-2/6">Expense Type</th>
        <th *ngIf="isEdit || isDelete"  class="py-3 px-6 text-center w-2/6">Actions</th>
      </tr>
    </thead>
      <tbody class="text-gray-600 text-sm font-light">
        <tr *ngFor="let list of filteredExpList; let i = index"  class="border-b border-gray-200 hover:bg-gray-100">
          <td class="py-3 px-6 text-center">{{ i + 1 }}</td>
          <td>{{ list.Expense_Category_Name }}</td>
          <td class="py-3 px-6 text-center break-words">{{ list.Expense_Type_Name }}</td>
          <td *ngIf="isEdit || isDelete"  class="py-3 px-6 text-centeraction-icons">
            <div class="flex gap-2 justify-center">
              <button *ngIf="isEdit" (click)="editExpense(list)"
                class="flex items-center h-10 px-4 py-2 bg-yellow-50 text-yellow-700 rounded-md hover:bg-yellow-100 transition-all duration-300 transform hover:scale-105 whitespace-nowrap">
                <span class="material-symbols-outlined mr-2">edit</span>
              </button>
              <button *ngIf="isDelete" (click)="deleteExpense(list)"
                class="flex items-center h-10 px-4 py-2 bg-red-50 text-red-700 rounded-md hover:bg-red-100 transition-all duration-300 transform hover:scale-105 whitespace-nowrap">
                <span class="material-symbols-outlined mr-2">delete</span>
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
    <div *ngIf="noResults" class="text-center text-red-500 mt-4">
    No matching expense types found.
     </div>
  </div>
</div>
